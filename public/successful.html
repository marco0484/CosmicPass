<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pago Exitoso | Cosmic Pass</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  background:#0b0f14;

  font-family:
    Arial,
    sans-serif;

  color:white;

  padding:20px;

}

.card{

  max-width:650px;
  width:100%;

  background:#111827;

  border:1px solid rgba(255,255,255,.08);

  border-radius:24px;

  padding:40px;

  text-align:center;

}

.icon{

  font-size:70px;

  margin-bottom:20px;

}

h1{

  font-size:2rem;

  margin-bottom:15px;

}

p{

  color:#cbd5e1;

  line-height:1.7;

  margin-bottom:12px;

}

.btn{

  display:inline-block;

  margin-top:25px;

  padding:14px 30px;

  border-radius:999px;

  background:#5bd43b;

  color:#000;

  text-decoration:none;

  font-weight:bold;

}

.btn:hover{

  opacity:.9;

}

</style>

</head>
<body>

<div class="card">

  <div class="icon">
    ✅
  </div>

  <h1>
    Pago recibido correctamente
  </h1>

  <p>
    Tu compra ha sido registrada con éxito.
  </p>

  <p>
    Nuestro equipo validará la información
    y emitirá tu acceso.
  </p>

  <p>
    Conserva tu comprobante de pago.
  </p>

  <a
    href="/"
    class="btn"
  >
    Volver al inicio
  </a>

</div>

</body>
</html>
