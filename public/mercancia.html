<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d1b">

  <title>Mercancía | Cosmic Pass</title>

  <link rel="icon" type="image/png" href="/images/cp.webp">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/mercancia.css">

  <script src="/js/mercancia.js" defer></script>
</head>

<body class="cp-catalog-page">

  <nav class="cp-catalog-nav">
    <a href="/" class="cp-catalog-brand">
      COSMIC PASS
    </a>

    <a
      id="back-to-producer"
      class="cp-back-link"
      href="/"
    >
      ← Volver a la productora
    </a>
  </nav>

  <main class="cp-catalog-main">

    <header class="cp-catalog-hero">
      <span class="cp-eyebrow">TIENDA OFICIAL</span>

      <h1 id="producer-title">Mercancía</h1>

      <p>
        Descubre los productos oficiales de esta productora.
      </p>
    </header>

    <div
      id="merchandise-status"
      class="cp-catalog-status"
      role="status"
      aria-live="polite"
    >
      Cargando mercancía...
    </div>

    <section
      id="merchandise-grid"
      class="cp-catalog-grid"
      aria-label="Productos disponibles"
    ></section>

  </main>

<footer>
 <p>Desarrollado por <strong>Matehuala Digital Engineering</strong></p>
</footer>

</body>
</html>
