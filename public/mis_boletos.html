<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Boletos | Cosmic Pass</title>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <nav class="main-nav">
    <div class="nav-left">
      <a href="index.html" class="back-btn">← Inicio</a>
    </div>

    <div class="logo">
      <a href="index.html">Cosmic Pass</a>
    </div>
  </nav>

  <main class="tickets-page">
    <div class="tickets-wrapper">

      <h1 class="tickets-title">Tus Boletos 🎟️</h1>

      <p class="tickets-subtitle">
        Ingresa tu correo y los últimos 4 dígitos de tu teléfono para consultar tus boletos de forma segura
      </p>

      <form id="ticket-search-form" class="tickets-form">

        <input
          type="email"
          id="email"
          class="tickets-input"
          placeholder="Correo electrónico"
          required
        />

        <input
          type="text"
          id="telefono"
          class="tickets-input"
          placeholder="Últimos 4 dígitos de tu teléfono"
          maxlength="4"
          inputmode="numeric"
          pattern="[0-9]{4}"
          required
        />

        <button type="submit" class="tickets-btn">
          Buscar Boletos
        </button>

      </form>

      <div id="tickets-container" class="tickets-box">
        <p>
          Aquí aparecerán tus boletos o recibirás un acceso seguro en tu correo.
        </p>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
