<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Boletos | Cosmic Pass</title>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="eventos.html">Eventos</a></li>
        <li><a href="productoras.html">Productoras</a></li>
        <li><a href="mis-boletos.html" class="active">Mis Boletos</a></li>
      </ul>
    </nav>
  </header>

  <main class="tickets-page">
    <div class="tickets-wrapper">

      <h1 class="tickets-title">Tus Boletos 🎟️</h1>

      <p class="tickets-subtitle">
        Ingresa tu correo para consultar tus tickets disponibles
      </p>

      <form id="ticket-search-form" class="tickets-form">
        <input
          type="email"
          id="email"
          class="tickets-input"
          placeholder="Ingresa tu correo"
          required
        />

        <button type="submit" class="tickets-btn">
          Buscar Boletos
        </button>
      </form>

      <div id="tickets-container" class="tickets-box">
        <p>Aquí aparecerán tus boletos.</p>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
