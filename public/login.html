<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="Cosmic Pass">
<meta name="theme-color" content="#050509">
<title>Login | Cosmic Pass</title>
<link rel="stylesheet" href="css/login.css">
<link rel="icon" type="image/png" href="images/cp.webp"> 
</head>
<body>
<main class="login-page">
  <form id="loginForm" class="login-card" novalidate>
    <div class="login-header">
      <img src="images/cp.webp" alt="Cosmic Pass">
      <p>Accede a tu cuenta</p>
    </div>

    <label for="userInput">
      <span>Usuario</span>
      <input
        id="userInput"
        type="text"
        name="user"
        placeholder="Ingresa tu usuario"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        required
      >
    </label>

    <label for="passwordInput">
      <span>Contraseña</span>
      <div class="password-wrap">
        <input
          id="passwordInput"
          type="password"
          name="password"
          placeholder="Ingresa tu contraseña"
          autocomplete="current-password"
          required
        >
        <button
          type="button"
          id="togglePassword"
          aria-label="Mostrar contraseña"
        >
          Ver
        </button>
      </div>
    </label>

    <p
      id="loginMessage"
      class="login-message"
      role="status"
      aria-live="polite"
    ></p>

    <button id="loginButton" class="login-btn" type="submit">
      <span>Iniciar sesión</span>
    </button>

    <p class="secure-note">
      Acceso exclusivo para usuarios autorizados
    </p>
  </form>
</main>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-Q3PHJK2BYG"></script>

window.dataLayer=window.dataLayer||[];
function gtag(){dataLayer.push(arguments);}
gtag("js",new Date());
gtag("config","G-Q3PHJK2BYG");
</script>
<script src="js/login.js"></script>
</body>
</html>
