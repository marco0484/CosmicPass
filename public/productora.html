<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productora</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<nav>
<a href="index.html" class="logo">Cosmic Pass</a>
<button class="btn-back" onclick="history.back()">⬅ Volver</button></nav>


<!-- HERO -->
<section class="producer-hero">

  <div class="hero-bg">
    <img id="producer-cover" alt="Imagen de la productora">
    <div class="overlay"></div>
  </div>

  <div class="hero-content">
  <div class="hero-inner">

    <img id="producer-logo" class="producer-logo">

    <h1 id="producer-name">Cargando...</h1>
    <p id="producer-tag"></p>

  </div>
</div>

</section>

<section class="producer-events-section"> 
  <h2>🔥 Compra tus boletos</h2>
  <div id="featured-event"></div>
  <div id="producer-events" class="events-grid"></div>
</section>


<section class="producer-story">
  <h2>¿Quiénes somos?</h2>
  <p id="historia"></p>

  <div class="badges"></div>
</section>

<section class="trust">
  <h2>¿Por qué elegir esta productora?</h2>

  <div class="trust-grid">
    <div class="trust-item">
      <h3>✔ Producción profesional</h3>
      <p>Eventos con estándares altos.</p>
    </div>

    <div class="trust-item">
      <h3>✔ Experiencias únicas</h3>
      <p>Eventos diseñados para impactar.</p>
    </div>

    <div class="trust-item">
      <h3>✔ Compra segura</h3>
      <p>Pagos protegidos + QR.</p>
    </div>
  </div>
</section>

<section class="producer-socials">
  <h2>Redes de la productora</h2>

  <div class="socials-icon">

    <a id="insta" href="#" target="_blank">
      <img src="images/instagram.svg" alt="Instagram">
    </a>

    <a id="fb" href="#" target="_blank">
      <img src="images/facebook.svg" alt="Facebook">
    </a>

    <a id="tiktok" href="#" target="_blank">
      <img src="images/tiktok.svg" alt="TikTok">
    </a>

    <a id="x" href="#" target="_blank">
      <img src="images/x.svg" alt="X">
    </a>

  </div>
</section>

<footer>
  © 2026 Cosmic Pass
</footer>

<script src="productora.js"></script>
</body>
</html>
