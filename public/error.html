<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<link rel="icon" type="image/png" sizes="32x32" href="images/cp.webp">
<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  background:#0b0f14;

  font-family:
    Arial,
    sans-serif;

  color:white;

  padding:20px;

}

.card{

  max-width:650px;
  width:100%;

  background:#111827;

  border:1px solid rgba(255,255,255,.08);

  border-radius:24px;

  padding:40px;

  text-align:center;

}

.icon{

  font-size:70px;

  margin-bottom:20px;

}

h1{

  font-size:2rem;

  margin-bottom:15px;

}

p{

  color:#cbd5e1;

  line-height:1.7;

  margin-bottom:12px;

}

.btn{

  display:inline-block;

  margin-top:25px;

  padding:14px 30px;

  border-radius:999px;

  background:#ef4444;

  color:white;

  text-decoration:none;

  font-weight:bold;

}

.btn:hover{

  opacity:.9;

}

</style>

</head>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-Q3PHJK2BYG"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-Q3PHJK2BYG');
</script>

<body>

<div class="card">

  <div class="icon">
    ❌
  </div>

  <h1>
    Pago cancelado
  </h1>

  <p>
    Tu compra no fue procesada.
  </p>

  <p>
    No se realizó ningún cargo
    o el proceso fue cancelado.
  </p>

  <p>
    Puedes volver a intentarlo cuando quieras.
  </p>

  <a
    href="/"
    class="btn"
  >
    Intentar nuevamente
  </a>

</div>
